/* demo 1 · la skill */
.chipCmd{font-family:var(--dato);font-size:24px;color:var(--acento);background:rgba(10,132,255,.10);padding:0 18px;height:52px;
  border-radius:9999px;display:flex;align-items:center;gap:2px}
.chipCmd i{display:inline-block;width:3px;height:26px;background:var(--acento);border-radius:2px;margin-left:6px}

.pil{height:56px;padding:0 26px;border-radius:9999px;background:var(--cristal-alto);border:1px solid var(--filete);

.tramos{display:flex;align-items:flex-end;gap:5px;height:56px;margin-right:22px}

.setenta{font-size:40px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}

/* demo 5 · la zona segura */
.miniM{position:relative;width:48px;height:86px;border-radius:10px;background:#0b0b0d;box-shadow:0 0 0 1px rgba(255,255,255,.2);overflow:hidden}

.miniLab{margin-left:18px;font-family:var(--dato);font-size:19px;letter-spacing:.12em;color:var(--tinta-baja);text-transform:uppercase}

<script>
document.getElementById('reel').insertAdjacentHTML('afterbegin',CIELO_HTML);
const M={f1:0.079, f2:4.159, f3:6.279, f4:11.899, f5:15.319, f6:18.1, f7:20.659, f8:23.699, f9:26.359, f10:29.279, f11:31.279, esto:20.659, carpeta:21.24, arrastras:21.78, claude:22.7, web:24.34, video:25.36, colores:27.06, tipo:28.02, devuelve:29.52, comenta:31.28, motion:31.76, mando:32.48, fin:33.11, pack:1.00, apple:2.94, skill:4.60, estilo:6.40, apple2:6.76, cristal:8.22, desenfoque:9.14, muelle:10.64, musica:11.90, tramos:13.04, setenta:13.60, voz:15.44, pal1:16.68, pal2:17.20, zona:18.34, reels:19.18, tiktok:19.58};
window.FPS=60;
const T=guion([
  ['entra',  -0.30, 0.56],                 // la carpeta CAE: en t=0 va por el 39 %
  ['golpea',  0.26, 0.40],
  ['abre',    M.f2-0.20, 0.50],            // «Lleva…» la pestaña se levanta
  ['v1', M.f2-0.06, 0.62], ['v2', M.estilo-0.10, 0.62], ['v3', M.musica-0.10, 0.62],
  ['v4', M.voz-0.14, 0.62], ['v5', M.zona-0.12, 0.62],
  ['pilFuera', M.desenfoque-0.34, 0.20], ['pilLento', M.desenfoque-0.10, 0.90], ['pilMuelle', M.muelle-0.06, 1.10],
  ['tramos', M.tramos-0.08, 0.60], ['setenta', M.setenta-0.06, 0.70],
  ['zona', M.reels-0.08, 0.40], ['bot', M.tiktok-0.06, 0.34], ['txt', M.tiktok+0.20, 0.50],
  ['vuelve', M.esto-0.78, 0.56],           // las cinco vuelven a la carpeta
  ['baja', M.esto-0.62, 0.62],             // y la carpeta baja al sitio de la cola
]);
const el={}; ['escena','carp','tab','lab','glow','onda','r1','r2','t1','t2','t3','t4','t5','f1','f2','f3','f4','f5','cmd','car','pil','tramos','odo70','vozb','subt','miniM','zona','bot','mtxt','rotA','a1','a2'].forEach(k=>el[k]=$(k));
const TR=[[46,'#7c8cff'],[30,'#7c8cff'],[52,'#7c8cff'],[36,'#7c8cff'],[54,'#ff8aa8'],[32,'#ff8aa8'],[50,'#ff8aa8'],[40,'#ff8aa8'],[56,'#c6f24e'],[34,'#c6f24e'],[52,'#c6f24e'],[44,'#c6f24e']];
el.tramos.innerHTML=TR.map(([h,c])=>`<i style="height:${h}px;background:${c}"></i>`).join(''); const TRB=[...el.tramos.children];
el.vozb.innerHTML=Array.from({length:9},()=>'<i style="height:40px"></i>').join(''); const VB=[...el.vozb.children];
const PAL=[...el.subt.querySelectorAll('i')];
const cola=COLA.montar({M,cabeza:'cabeza',dominio:'midominio.com',tema:'cómo funciona en 30 s'});
window.DURACION=+(cola.fin).toFixed(2);
const FILAS=[el.f1,el.f2,el.f3,el.f4,el.f5], TOPS=[770,898,1026,1154,1282];
const TILES=[el.t1,el.t2,el.t3,el.t4,el.t5], CONF=[...document.querySelectorAll('.conf')], CHIS=[...document.querySelectorAll('.chispa')];
window.seek=function(t){
  cieloSeek(t);
  /* la carpeta cae y golpea; luego baja al sitio de la cola */
  const entra=Math.pow(p(t,T.entra[0],T.entra[1]),1.5);
  const kBaja=easeInOut(p(t,T.baja[0],T.baja[1]));
  const cy=mix(0,194,kBaja);
  const trC=`translate(0,${mix(-420,0,entra)+cy}px) scale(${mix(1.7,1,entra)}) rotate(${mix(-9,0,entra)}deg)`;
  el.carp.style.transform=trC; el.carp.style.filter=`blur(${mix(7,0,entra)}px)`; el.carp.style.opacity=t>=T.entra[0]?1:0;
  const kAb=easeOut(p(t,T.abre[0],T.abre[1]))-easeOut(p(t,T.vuelve[1]-0.2,T.vuelve[1]+0.2));
  el.tab.style.transform=`translate(0,${mix(-420,0,entra)+cy}px) scale(${mix(1.7,1,entra)}) rotate(${mix(-9,0,entra)-kAb*22}deg)`;
  el.tab.style.filter=el.carp.style.filter; el.tab.style.opacity=el.carp.style.opacity;
  el.lab.style.transform=`translate(0,${mix(-420,0,entra)+cy}px) scale(${mix(1.7,1,entra)})`; el.lab.style.opacity=t>=T.entra[0]?entra:0;
  el.lab.style.transformOrigin='50% -74px';
  el.glow.style.opacity=kAb*0.9+pulso(p(t,T.golpea[0],T.golpea[0]+0.5))*0.6; el.glow.style.transform=`translate(0,${cy}px)`;
  const kO=p(t,T.golpea[0],T.golpea[0]+0.6); el.onda.style.opacity=pulso(kO)*0.6; el.onda.style.transform=`scale(${mix(0.96,1.3,easeOut(kO))})`;
  /* el estallido: al golpear, las cinco fichas salen disparadas y se quedan orbitando la carpeta */
  const kB=easeOut(p(t,T.golpea[0],T.golpea[0]+0.55));
  const orb=(i,tt)=>{const a=(i*72+tt*38-90)*Math.PI/180, R=mix(0,215,kB); return [540+R*Math.cos(a)-36, 563+R*Math.sin(a)*0.78-36];};
  TILES.forEach((n,i)=>{
    const c=T['v'+(i+1)], kv=easeInOut(p(t,c[0],c[1]));
    const [ox,oy]=orb(i, Math.min(t,c[0]));            // la órbita se congela al salir
    const tx=190, ty=TOPS[i]+20;                        // el hueco del icono en su fila
    const x=mix(ox,tx,kv)+arco(kv,-60), y=mix(oy,ty,kv);
    n.style.opacity=(t>=T.golpea[0]?1:0)*(1-easeOut(p(t,c[1]-0.06,c[1]+0.06)));
    n.style.transform=`translate(${x-504}px,${y-527}px) rotate(${(1-kB)*540+pulso(kv)*-18}deg) scale(${mix(0.2,1,kB)+respira(t,0.05,0.7,i)})`;
    n.style.filter=`blur(${(1-kB)*10+pulso(kv)*3}px)`;
  });
  /* las filas nacen del icono que aterriza, y al final vuelven a la carpeta */
  FILAS.forEach((f,i)=>{
    const c=T['v'+(i+1)], k=easeOut(p(t,c[1]-0.10,c[1]+0.46));
    const r=easeInOut(p(t,T.vuelve[0]+i*0.06,T.vuelve[1]+i*0.06));
    const y0=563-(TOPS[i]+56);
    f.style.top=TOPS[i]+'px';
    f.style.opacity=k*(1-r);
    f.style.transform=r>0?`translate(0,${mix(0,y0,r)}px) scale(${mix(1,0.22,r)})`:`scaleX(${mix(0.12,1,k)}) scaleY(${mix(0.7,1,k)})`;
    f.style.filter=`blur(${(1-k)*12+r*14}px)`;
  });
  /* confeti con gravedad en el golpe, y chispas que caen siempre */
  CONF.forEach((c,i)=>{const k=p(t,T.golpea[0],T.golpea[0]+1.3); const a=i*(Math.PI*2/24)+hash(i)*0.6, v=300+hash(i+9)*260;
    c.style.opacity=(k>0&&k<1)?1-k*k:0;
    c.style.transform=`translate(${Math.cos(a)*v*easeOut(k)}px,${Math.sin(a)*v*easeOut(k)*0.8+520*k*k}px) rotate(${k*720*(hash(i)-0.5)}deg) scale(${mix(1.3,0.6,k)})`;});
  CHIS.forEach((c,i)=>{const per=3.2+hash(i)*2.4, k=((t+hash(i+3)*per)%per)/per; const x=120+hash(i+7)*840, y=mix(380,1500,k);
    c.style.left=x+'px'; c.style.top=y+'px'; c.style.opacity=(t>T.golpea[0]?1:0)*pulso(k)*0.9*mix(0.4,1,hash(i+11));
    c.style.transform=`translateX(${respira(t,14,0.3+hash(i)*0.3,i)}px) scale(${mix(0.5,1.2,hash(i+5))})`;});
  /* dos rayos de luz cruzan en el primer segundo */
  [[el.r1,-24,-1],[el.r2,22,1]].forEach(([n,ang,dir])=>{const k=p(t,T.golpea[0]-0.05,T.golpea[0]+0.9);
    n.style.opacity=pulso(k)*0.9; n.style.transform=`translateX(${dir*mix(-500,500,easeInOut(k))}px) rotate(${ang}deg)`;});
  /* demo 1 · el cursor de la skill parpadea */
  el.car.style.opacity=frame(t)%40<21?1:0;
  /* demo 2 · la píldora: cristal → sale y entra desenfocada → aterriza con muelle */
  const kF=easeOut(p(t,T.pilFuera[0],T.pilFuera[1])), kL=easeOut(p(t,T.pilLento[0],T.pilLento[1])), kM=spring(p(t,T.pilMuelle[0],T.pilMuelle[1]),0.28,9);
  let po=1-kF+kL, pb=kF*10*(1-kL)+(t>=T.pilLento[0]?(1-kL)*16:0), py=0;
  if(t>=T.pilMuelle[0]){ py=(1-kM)*-70; }
  const sq=pulso(p(t,T.pilMuelle[0],T.pilMuelle[0]+0.28))*0.12;
  el.pil.style.opacity=clamp(po,0,1); el.pil.style.filter=`blur(${pb}px)`;
  el.pil.style.transform=`translateY(${py}px) scale(${1+sq},${1-sq})`;
  el.pil.style.background=t>=M.cristal-0.05?'var(--cristal-alto)':'#fff';
  /* demo 3 · los tramos se encienden por familias y el contador rueda a 70 */
  TRB.forEach((b,i)=>{const fam=Math.floor(i/4); const k=easeOut(p(t,T.tramos[0]+fam*0.18,T.tramos[0]+fam*0.18+0.36));
    b.style.transform=`scaleY(${mix(0.18,1,k)*(1+respira(t,0.14,0.6+i*0.05,i))})`; b.style.opacity=mix(0.25,1,k);});
