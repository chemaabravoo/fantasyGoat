<body>

<script>
document.getElementById('reel').insertAdjacentHTML('afterbegin',CIELO_HTML);
const M={f1:11.099, f2:14.279, f3:16.539, f4:19.3, f5:21.96, f6:24.439, f7:25.96, esto:14.279, carpeta:16.9, arrastras:17.5, claude:18.419, web:19.96, video:20.979, colores:22.479, tipo:23.179, devuelve:24.719, comenta:25.96, motion:26.46, mando:27.579, fin:28.276};
const T=guion([
  ['entra',  -0.06, 0.52], ['pulsa', 0.56, 0.34], ['pill', 0.70, 0.58], ['card', 1.34, 0.74],
  ['onda',    1.94, 0.60], ['gira',  2.24, 1.00], ['prog', 2.26, 5.90], ['ctrl', 3.02, 0.50],
  ['cora',    3.64, 0.44], ['sale',  4.36, 0.84], ['vuelve',5.44, 0.70], ['cambia',6.00, 0.60],
  ['anillo',  6.86, 1.04], ['abre',  8.26, 0.80], ['plega', 9.06, 0.72], ['crece',11.10, 0.86],
]);
window.FPS=60;
const el={}; ['escena','cabeza','pl','plSom','tri','mini','full','disco','discoI','tit','art','chipHz','ondaBox',
 'prog','progI','progU','tmA','tmBox','ctrl','btA','btB','btC','cora','coraOnda','coraP','grande','rotA','a1','a2'].forEach(k=>el[k]=$(k));
const N=28; el.ondaBox.innerHTML=Array.from({length:N},(_,i)=>`<i class="wv" id="wv${i}"></i>`).join('');
const WV=Array.from({length:N},(_,i)=>$('wv'+i));
const cola=COLA.montar({M,cabeza:'cabeza',dominio:'midominio.com',tema:'cómo funciona en 30 s'});
window.DURACION=+(cola.fin).toFixed(2);
const FORMAS=[[460,905,160,160,80],[300,915,480,140,70],[170,620,740,760,36]];

window.seek=function(t){
  cieloSeek(t);
  /* el objeto: círculo · píldora · tarjeta */
  const s=clamp(easeInOut(p(t,T.pill[0],T.pill[1]))+easeInOut(p(t,T.card[0],T.card[1]))
     -easeInOut(p(t,T.plega[0],T.plega[1]))+easeInOut(p(t,T.crece[0],T.crece[1])),0,2);
  const i0=Math.min(1,Math.floor(s)), f=s-i0, A=FORMAS[i0], B=FORMAS[i0+1];
  const L=mix(A[0],B[0],f),TP=mix(A[1],B[1],f),W=mix(A[2],B[2],f),H=mix(A[3],B[3],f),R=mix(A[4],B[4],f);
  const entra=easeOut(p(t,T.entra[0],T.entra[1]));
  caja(el.pl,L,TP,W,H,R); caja(el.plSom,L,TP,W,H,R);
  el.pl.style.transform=`translateY(${mix(70,0,entra)}px) scale(${mix(0.62,1,entra)}) rotate(${mix(-24,0,entra)}deg)`;
  el.pl.style.opacity=entra; el.plSom.style.transform=el.pl.style.transform; el.plSom.style.opacity=clamp(s-1,0,1)*0.8;
  el.tri.style.opacity=1-clamp((s-0.12)/0.34,0,1);
  el.tri.style.transform=`scale(${1-pulso(p(t,T.pulsa[0],T.pulsa[1]))*0.16})`;
  el.mini.style.opacity=Math.min(clamp((s-0.52)/0.34,0,1),1-clamp((s-1.14)/0.34,0,1));
  const kF=clamp((s-1.22)/0.42,0,1); el.full.style.opacity=kF;
  /* el disco gira desde que suena; y a los 6 s cambia la canción */
  const kGi=easeInOut(p(t,T.gira[0],T.gira[1]));
  const kCa=p(t,T.cambia[0],T.cambia[1]);
  el.disco.style.borderRadius=mix(28,100,kGi)+'px';
  el.disco.style.transform=`rotate(${(t>T.gira[0]?(t-T.gira[0])*46:0)*kGi}deg)`;
  el.disco.style.filter=`hue-rotate(${easeInOut(kCa)*140}deg)`;
  el.discoI.style.opacity=kGi;
  const sw=pulso(kCa); el.tit.textContent=kCa>0.5?'Ciudad Vacía':'Modo Nocturno'; el.art.textContent=kCa>0.5?'Luna · Álbum':'Luna · Single';
  el.tit.style.filter=el.art.style.filter=`blur(${sw*10}px)`; el.tit.style.transform=el.art.style.transform=`translateY(${sw*-10}px)`;
  /* la onda: 28 barras que nunca paran y se cierran en anillo */
  const vivo=easeOut(p(t,T.onda[0],T.onda[1]));
  const kAn=easeInOut(p(t,T.anillo[0],T.anillo[1]))-easeInOut(p(t,T.abre[0],T.abre[1]));
  const foco=1-kAn*0.78;
  WV.forEach((n,i)=>{
    const f1=1.9+((i*7)%11)*0.23, f2=3.1+((i*5)%7)*0.19;
    const amp=0.42+0.58*Math.abs(Math.sin(t*f1+i*0.7))*Math.abs(Math.cos(t*f2*0.5+i*0.31));
    const alto=(16+amp*mix(118,112,kAn))*vivo, x0=(i-(N-1)/2)*23.4, a=i*(360/N), rad=a*Math.PI/180, Rr=120;
    n.style.height=alto+'px'; n.style.opacity=vivo;
    n.style.transform=`translate(${mix(x0,Rr*Math.sin(rad),kAn)}px,${mix(0,-130-Rr*Math.cos(rad),kAn)}px) rotate(${mix(0,a,kAn)}deg)`;
  });
  for(const n of [el.disco,el.tit,el.art,el.chipHz,el.prog,el.tmBox]){ n.style.opacity=foco; if(n!==el.disco&&n!==el.tit&&n!==el.art) n.style.filter=`blur(${kAn*8}px)`; }
  el.disco.style.filter+=` blur(${kAn*8}px)`;
  /* barra y tiempo */
  const kPr=p(t,T.prog[0],T.prog[1])*(1-easeInOut(kCa))+easeInOut(kCa)*p(t,T.cambia[1],T.cambia[1]+6)*0.5;
  el.progI.style.transform=`scaleX(${kPr*0.62})`; el.progU.style.left=(656*kPr*0.62)+'px'; el.progU.style.opacity=kF;
  odoPasos(el.tmA,[[0,'0:00'],[T.prog[0]+0.1,'0:04'],[2.9,'0:21'],[3.8,'0:47'],[4.9,'1:12'],[T.cambia[0]+0.3,'0:00'],[7.3,'0:12'],[8.6,'0:31'],[10.4,'0:58'],[12.4,'1:20']],t,29);
  /* controles y corazón */
  [el.btB,el.btA,el.btC].forEach((n,i)=>{ const k=easeOut(p(t,T.ctrl[0]+i*0.08,T.ctrl[0]+i*0.08+0.42));
    n.style.opacity=k*foco; n.style.filter=`blur(${kAn*8}px)`; n.style.transform=`translateY(${mix(22,0,k)}px) scale(${mix(0.8,1,k)})`; });
  const kCo=easeOut(p(t,T.cora[0],T.cora[1]));
  el.cora.style.opacity=easeOut(p(t,T.ctrl[0]+0.24,T.ctrl[0]+0.66))*foco; el.cora.style.filter=`blur(${kAn*8}px)`;
  el.cora.style.transform=`scale(${1+pulso(p(t,T.cora[0],T.cora[0]+0.44))*0.24})`;
  el.coraP.setAttribute('fill',kCo>0.5?'#ff3b5c':'none');
  const kCw=p(t,T.cora[0],T.cora[0]+0.6); el.coraOnda.style.opacity=pulso(kCw)*0.8; el.coraOnda.style.transform=`scale(${mix(1,1.9,easeOut(kCw))})`;
  /* la portada sale, crece y vuelve */
  const kSa=easeInOut(p(t,T.sale[0],T.sale[1]))-easeInOut(p(t,T.vuelve[0],T.vuelve[1]));
  el.grande.style.opacity=kSa; el.grande.style.filter=`blur(${mix(18,0,kSa)}px)`;
  el.grande.style.transform=`translateY(${mix(60,0,kSa)}px) scale(${mix(0.3,1,kSa)}) rotate(${mix(-14,0,kSa)}deg)`;
  el.pl.style.filter=`blur(${mix(13,0,entra)+kSa*9}px)`;
  /* el rótulo del puente */
  const sR=1-easeOut(p(t,M.esto-0.42,M.esto-0.06));
  palabras([el.a1,el.a2],t,M.f1-0.10,0.42,0.44,sR); el.rotA.style.filter=`blur(${(1-sR)*12}px)`;
  /* la cola */
  const v=cola.seek(t);
  /* la cámara */
  let cs=1+respira(t,0.005,0.021);
  cs+=easeOut(p(t,T.card[0],T.card[0]+0.30))*0.05-easeInOut(p(t,T.card[1],T.card[1]+0.8))*0.05;
  cs+=easeInOut(p(t,T.anillo[0],T.anillo[1]))*0.05-easeInOut(p(t,T.abre[0],T.abre[1]))*0.05;
  cs+=easeInOut(p(t,cola.T.movil[0],cola.T.movil[1]+0.2))*0.04-easeInOut(p(t,cola.T.cierre[0]-0.6,cola.T.cierre[0]))*0.04;
  cs*=mix(1,0.985,v);
  const sy=960+shake(t,T.pulsa[0],9)+shake(t,T.card[0],12)+shake(t,T.cora[0],7)+shake(t,cola.T.suelta[0],8)+shake(t,cola.T.cierre[0],9);
  el.escena.style.transform=camara(cs,540,960,540,sy);
};
const SFX=[
  ['whoosh',T.entra[0]+0.06,0.24],['pop',T.pulsa[0],0.34],['swipe',T.pill[0],0.20],['brillo',T.card[0],0.26],
  ['datos',T.onda[0],0.20],['clic',T.ctrl[0]+0.06,0.20],['pop',T.cora[0],0.26,1.2],['whoosh',T.sale[0],0.22],
  ['swipe',T.cambia[0],0.18],['brillo',T.anillo[0],0.24],['swipe',T.plega[0],0.20],
].concat(cola.SFX);
const MUSICA=[
  ['energia-himno',0,0.17],
  ['neutra-cristal',M.f1-0.30,0.11,'fundido'],
  ['energia-eco',M.devuelve-0.20,0.16,'sube'],
];
window.MARCAS=Object.assign({},T,{SFX,MUSICA,fin:window.DURACION});
arrancar();
</script>
